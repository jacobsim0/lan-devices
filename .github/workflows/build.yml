name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev clang
      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: Unit tests
        run: make check
      - name: Unit tests under ASan + UBSan
        run: make check-asan
      - name: Fuzz every parser for 30 s
        run: make CC=clang FUZZ_TIME=30 fuzz
      - name: Smoke test
        run: ./lan-devices -h && ./lan-devices --passive --no-vendor
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: Unit tests
        run: make check
      - name: Smoke test
        run: ./lan-devices -h && ./lan-devices --passive --no-vendor
