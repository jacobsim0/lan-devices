name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev clang
      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: Unit tests
        run: make check
      - name: Unit tests under ASan + UBSan
        run: make check-asan
      - name: Fuzz every parser for 30 s
        run: make CC=clang FUZZ_TIME=30 fuzz
      - name: Smoke test
        run: ./lan-devices -h && ./lan-devices --passive --no-vendor
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: Unit tests
        run: make check
      - name: Smoke test
        run: ./lan-devices -h && ./lan-devices --passive --no-vendor
  image:
    # Multi-arch container image on GHCR; runs after the build/test jobs pass.
    needs: [linux, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
